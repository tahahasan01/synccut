<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.45 system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; color: #18181b; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .status { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #f4f4f5; font-weight: 600; }
      .rec { background: #fee2e2; color: #b91c1c; }
      p { color: #52525b; margin: 10px 0 0; }
      kbd { background: #f4f4f5; border: 1px solid #d4d4d8; border-radius: 4px; padding: 0 4px; }
    </style>
  </head>
  <body>
    <h1>SyncCut</h1>
    <span id="status" class="status">Idle</span>
    <p>Start a take in the SyncCut app. While it records, press <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> to mark the next step from any tab.</p>
    <p>Events are only collected while recording. Passwords and payment fields are never read.</p>
    <script src="popup.js"></script>
  </body>
</html>
